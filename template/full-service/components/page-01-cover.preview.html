<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cover — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css" />
<style>
  .cover {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .cover-photo-wrap {
    position: relative;
    flex: 0 0 62%;
    overflow: hidden;
  }
  .cover-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 70% 35%;
    display: block;
  }
  /* Panel diagonal: mismo recurso visual que el original (un corte
     diagonal en la esquina inferior derecha de la foto), hecho con
     clip-path real en vez de clonar un polígono del PDF. El fondo y el
     contenido van en capas separadas: si el clip-path tocara también el
     texto, lo recorta (así se veía roto en el primer intento). */
  .cover-panel-bg {
    position: absolute;
    inset: 0;
    clip-path: polygon(58% 100%, 100% 22%, 100% 100%);
    background: var(--purple-dark);
  }
  .cover-panel-content {
    position: absolute;
    right: var(--space-5);
    bottom: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    align-items: flex-start;
    max-width: 220px;
  }
  .cover-logo { height: 34px; display: block; }
  .cover-panel-content .proposal-label {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.01em;
  }
  .cover-panel-content .school-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    background: #fff;
    padding: 2px 10px;
    border-radius: 4px;
  }

  .cover-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: var(--space-5) var(--space-6) var(--space-5);
  }
  .cover-title {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.25;
    max-width: 420px;
  }
  .cover-title .accent {
    background: var(--gradient-brand);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .cover-meta {
    display: flex;
    border-top: 2px solid transparent;
    border-image: var(--gradient-brand) 1;
    padding-top: var(--space-3);
    gap: var(--space-6);
  }
  .cover-meta div { flex: 1; }
  .cover-meta .label {
    font-size: 12px;
    font-weight: 700;
    color: var(--purple);
    margin-bottom: 2px;
  }
  .cover-meta .value {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
  }
</style>
</head>
<body>
<section class="page cover">
  <div class="cover-photo-wrap">
    <img src="../assets/img_934.png" alt="" />
    <div class="cover-panel-bg"></div>
    <div class="cover-panel-content">
      <img class="cover-logo" src="../../../brand/trusted-logo-white.png" alt="TrustED" />
      <div class="proposal-label">PROPOSAL</div>
      <div class="school-name">PROUD Academy</div>
    </div>
  </div>
  <div class="cover-body">
    <h1 class="cover-title">
      <span class="accent">Network-wide</span><br />
      Full-Service: Student Recruitment Support
    </h1>
    <div class="cover-meta">
      <div>
        <div class="label">Prepared for</div>
        <div class="value">PROUD Academy</div>
      </div>
      <div>
        <div class="label">Prepared by</div>
        <div class="value">TrustED Solutions</div>
      </div>
      <div>
        <div class="label">Date</div>
        <div class="value">September 25, 2026</div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
